[package]
name = "umami-cli"
description = "Command-line interface for the umami log anomaly-detection library."
readme = "../README.md"
keywords = ["log", "anomaly", "cli", "detection", "observability"]
categories = ["command-line-utilities"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# clap 4.6 (edition 2024) needs 1.85; the library itself builds on 1.74.
rust-version = "1.85"

[[bin]]
name = "umami"
path = "src/main.rs"

[dependencies]
umami = { workspace = true }
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
