[package]
name = "umami-log"
description = "Reusable library for log anomaly detection: structural tokenization, structure signatures, per-system event profiles and anomaly classification."
readme = "README.md"
keywords = ["log", "anomaly", "tokenizer", "observability", "detection"]
categories = ["parsing", "algorithms"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "umami"

[dependencies]
serde = { version = "1.0.200", features = ["derive"], optional = true }

[features]
# Serialize/Deserialize for ProfileStore and the types in it, so learned state
# can be saved and loaded.
serde = ["dep:serde"]

[dev-dependencies]
serde_json = "1"
criterion = { version = "0.5", default-features = false }
proptest = "1"

[[bench]]
name = "tokenize"
harness = false

[[bench]]
name = "detect"
harness = false

[package.metadata.docs.rs]
all-features = true
