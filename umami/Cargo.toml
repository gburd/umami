[package]
name = "umami"
description = "Reusable library reimplementing the Unomaly log anomaly-detection algorithm: structural tokenization, structure signatures, per-system event profiles and anomaly classification."
readme = "README.md"
keywords = ["log", "anomaly", "tokenizer", "observability", "unomaly"]
categories = ["parsing", "algorithms"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
proptest = "1"

[[bench]]
name = "tokenize"
harness = false

[[bench]]
name = "detect"
harness = false
