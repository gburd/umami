name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TARGET_DIR: /scratch/umami/target-ci
  TMPDIR: /scratch/umami/tmp
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare scratch directories
        run: |
          sudo mkdir -p /scratch/umami
          sudo chown "$USER" /scratch/umami
          mkdir -p "$TMPDIR"
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo +stable fmt --all --check
      - run: cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo +stable test --workspace --all-features --locked
      - run: cargo +stable doc --workspace --all-features --no-deps --locked
      - name: Check release tooling
        run: |
          shellcheck scripts/*.sh
          scripts/test-release.sh

  msrv:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - package: library
            toolchain: 1.74.0
          - package: cli
            toolchain: 1.85.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare scratch directories
        run: |
          sudo mkdir -p /scratch/umami
          sudo chown "$USER" /scratch/umami
          mkdir -p "$TMPDIR"
      - name: Install Rust
        run: rustup toolchain install '${{ matrix.toolchain }}' --profile minimal
      - run: scripts/check-msrv.sh '${{ matrix.package }}'
