name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: /scratch/umami/target-ci
      TMPDIR: /scratch/umami/tmp
      RELEASE_REF: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare build tools
        run: |
          sudo mkdir -p /scratch/umami
          sudo chown "$USER" /scratch/umami
          mkdir -p "$TMPDIR"
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup toolchain install 1.88.0 --profile minimal --target x86_64-unknown-linux-musl
      - name: Build and check release artifacts
        run: |
          scripts/release.sh build "$RELEASE_REF" /scratch/umami/dist
          scripts/release.sh check "$RELEASE_REF" /scratch/umami/dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: /scratch/umami/dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: dist
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          ../scripts/check-release-ref.sh "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
            "$RELEASE_REF" "$GITHUB_SHA"
          gh release create "$RELEASE_REF" --verify-tag --title "$RELEASE_REF" \
            --notes 'Source, API documentation, and static Linux x86_64-musl CLI. See packaging/README.md in the source archive for build and verification instructions.' \
            ./*.tar.gz SHA256SUMS
